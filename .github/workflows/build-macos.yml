name: Build and Release Jarvis

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 google-genai pillow pyinstaller edge-tts pygame sounddevice pvporcupine speechrecognition

      - name: Build Windows Executable
        run: |
          pyinstaller Jarvis.spec

      - name: Upload Windows to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/Jarvis.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Windows
          path: dist/Jarvis.exe

  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 google-genai pillow pyinstaller edge-tts pygame sounddevice pvporcupine speechrecognition

      - name: Build macOS App Bundle with PyInstaller
        run: |
          pyinstaller \
            --windowed \
            --noconsole \
            --name "Jarvis" \
            --add-data "wallpaper.png:." \
            --clean \
            jarvis.pyw

      - name: Package App Bundle into ZIP
        run: |
          cd dist
          zip -r -y Jarvis-macOS.zip Jarvis.app

      - name: Upload macOS to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/Jarvis-macOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-macOS
          path: dist/Jarvis-macOS.zip
