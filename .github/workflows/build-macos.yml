name: Build and Release Rexi

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 google-genai pillow pyinstaller

      - name: Build Windows Executable
        run: |
          pyinstaller --noconsole --onefile --add-data "rex.png;." --add-data "trex_icon.png;." --name "Rexi" --clean rexi.pyw

      - name: Upload Windows to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/Rexi.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rexi-Windows
          path: dist/Rexi.exe

  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 google-genai pillow pyinstaller

      - name: Build macOS App Bundle with PyInstaller
        run: |
          pyinstaller \
            --windowed \
            --noconsole \
            --name "Rexi" \
            --add-data "rex.png:." \
            --add-data "trex_icon.png:." \
            --clean \
            rexi.pyw

      - name: Package App Bundle into ZIP
        run: |
          cd dist
          zip -r -y Rexi-macOS.zip Rexi.app

      - name: Upload macOS to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/Rexi-macOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rexi-macOS
          path: dist/Rexi-macOS.zip
